        - generic [ref=f3e94]:
          - paragraph [ref=f3e95]: भारतीय अंतरिक्ष अनुसंधान संगठन (इसरो) ने आज एक और नया कीर्तिमान स्थापित किया है। चंद्रयान और गगनयान अभियानों के बाद भारत ने अंतरिक्ष विज्ञान में अपनी स्थिति को और मजबूत किया है। इस ऐतिहासिक मिशन के साथ देश के वैज्ञानिकों ने सिद्ध कर दिया है कि भारत की अंतरिक्ष क्षमता विश्व स्तरीय है।
          - figure "सतीश धवन अंतरिक्ष केंद्र से उड़ान भरता रॉकेट" [ref=f3e96]:
            - img "इसरो रॉकेट" [ref=f3e97]
          - paragraph [ref=f3e99]: वैज्ञानिकों का कहना है कि यह सफलता देश के करोड़ों युवाओं को विज्ञान और नवाचार की दिशा में प्रेरित करेगी। आने वाले दिनों में और कई महत्वपूर्ण परीक्षण किए जाएंगे जो भविष्य के मानव मिशन की नींव रखेंगे। परियोजना निदेशक ने बताया कि सभी प्रणालियां सामान्य रूप से कार्य कर रही हैं और डेटा संग्रहण सुचारू रूप से जारी है।
          - paragraph [ref=f3e100]: इसरो के इस मिशन से मौसम पूर्वानुमान, संचार व्यवस्था और उपग्रह निगरानी में भी अभूतपूर्व सुधार देखने को मिलेगा। पूरे देश में इस उपलब्धि पर गर्व का माहौल है।
